version: '3.9'

networks:
  ghost-internal:
    driver: bridge
    internal: false  # Allow external access for development
  ghost-public:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  ollama_data:
    driver: local
  mirror_npm_data:
    driver: local
  mirror_pypi_data:
    driver: local
  ghost_gateway_data:
    driver: local

services:
  # PostgreSQL + pgvector
  postgres:
    image: pgvector/pgvector:pg15
    container_name: ghost-v02a-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ghost
      POSTGRES_PASSWORD: ghost
      POSTGRES_DB: ghost
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    ports:
      - "4000:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ghost-internal
      - ghost-public
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghost -d ghost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: ghost-v02a-redis
    restart: unless-stopped
    ports:
      - "4001:6379"
    volumes:
      - redis_data:/data
    networks:
      - ghost-internal
      - ghost-public
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ollama LLM Server
  ollama:
    image: ollama/ollama:latest
    container_name: ghost-v02a-ollama
    restart: unless-stopped
    ports:
      - "4002:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_PORT=11434
    networks:
      - ghost-internal
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MCP Client for Ollama (Sidecar)
  mcp-ollama:
    build:
      context: ./services/mcp-ollama
      dockerfile: Dockerfile
    container_name: ghost-v02a-mcp-ollama
    restart: unless-stopped
    ports:
      - "4003:8080"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5:1.5b-instruct
      - MCP_AUTO_DISCOVERY=true
    networks:
      - ghost-internal
    depends_on:
      ollama:
        condition: service_healthy

  # Ghost Server (Code Execution Sandbox with MCP)
  ghost-server:
    build:
      context: ./services/ghost-server
      dockerfile: Dockerfile
    container_name: ghost-v02a-ghost-server
    restart: unless-stopped
    ports:
      - "4005:5905"
    environment:
      - GHOST_PORT=5905
      - GHOST_API_KEY=${GHOST_API_KEY:-ghost-dev-api}
    networks:
      - ghost-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5905/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Ghost API (NestJS Backend)
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.production
    container_name: ghost-v02a-api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://ghost:ghost@postgres:5432/ghost
      - JWT_SECRET=${JWT_SECRET}
      - API_PORT=5906
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GHOST_SERVER_URL=http://ghost-server:5905
      - GHOST_LOG_WS_URL=ws://ghost-server:5905/ws/logs
      - GHOST_SERVER_API_KEY=${GHOST_API_KEY:-ghost-dev-api}
      - OLLAMA_HOST=http://ollama:11434
      - MCP_OLLAMA_URL=http://mcp-ollama:8080
    ports:
      - "4006:5906"
    networks:
      - ghost-internal
      - ghost-public
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ghost-server:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5906/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Dashboard (Next.js Frontend)
  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile.production
    container_name: ghost-v02a-dashboard
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4006
      - NEXT_PUBLIC_WS_URL=ws://localhost:4006
      - NEXT_PUBLIC_GHOST_LOG_WS_URL=ws://localhost:4005/ws/logs
    ports:
      - "4007:5900"
    networks:
      - ghost-public
    depends_on:
      api:
        condition: service_healthy

  # Rust Core Gateway (Axum service)
  ghost-gateway:
    build:
      context: ./rust-core
      dockerfile: Dockerfile
    container_name: ghost-v02a-gateway
    restart: unless-stopped
    environment:
      - GHOST_GATEWAY_HOST=0.0.0.0
      - GHOST_GATEWAY_PORT=5907
      - GHOST_STORAGE_DIR=/data
      - RUST_LOG=ghost_gateway=info,tower_http=info
    ports:
      - "4010:5907"
    volumes:
      - ghost_gateway_data:/data
    networks:
      - ghost-internal
      - ghost-public
    depends_on:
      storage-adapter-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5907/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # One-shot container to prepare gateway storage structure
  storage-adapter-init:
    image: busybox:1.36
    container_name: ghost-v02a-storage-init
    command: ["sh", "-c", "mkdir -p /data/files"]
    volumes:
      - ghost_gateway_data:/data
    networks:
      - ghost-internal
    restart: "no"

  # NPM Mirror (Verdaccio)
  mirror-npm:
    image: verdaccio/verdaccio:5
    container_name: ghost-v02a-mirror-npm
    restart: unless-stopped
    ports:
      - "4008:4873"
    volumes:
      - mirror_npm_data:/verdaccio/storage
    networks:
      - ghost-internal

  # PyPI Mirror (devpi)
  mirror-pypi:
    image: muccg/devpi:latest
    container_name: ghost-v02a-mirror-pypi
    restart: unless-stopped
    ports:
      - "4009:3141"
    volumes:
      - mirror_pypi_data:/data
    networks:
      - ghost-internal
