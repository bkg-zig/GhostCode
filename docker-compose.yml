version: '3.8'

services:
  # PostgreSQL + pgvector
  db:
    image: pgvector/pgvector:pg15
    container_name: ghost-db-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ghost}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ghost}
      POSTGRES_DB: ${POSTGRES_DB:-ghost}
    ports:
      - "127.0.0.1:4000:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - ghost-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ghost} -d ${POSTGRES_DB:-ghost}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=100m

  # Redis
  redis:
    image: redis:7-alpine
    container_name: ghost-redis-prod
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:4001:6379"
    networks:
      - ghost-internal
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "auth", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /data:rw,noexec,nosuid,size=256m

  # Ollama for LLM
  ollama:
    image: ollama/ollama:latest
    container_name: ghost-ollama-prod
    ports:
      - "127.0.0.1:4002:11434"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - ghost-internal
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_MAX_QUEUE=512
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Rust Gateway
  gateway:
    build:
      context: ./rust-core
      dockerfile: Dockerfile
    container_name: ghost-gateway-prod
    environment:
      - GHOST_GATEWAY_HOST=0.0.0.0
      - GHOST_GATEWAY_PORT=4729
      - GHOST_STORAGE_DIR=/data/storage
      - RUST_LOG=ghost_gateway=info,tower_http=info
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ghost}:${POSTGRES_PASSWORD:-ghost}@db:5432/${POSTGRES_DB:-ghost}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
    ports:
      - "127.0.0.1:4729:4729"
    volumes:
      - gateway_storage:/data/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ghost-internal
      - ghost-public
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4729/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=50m

  # Node Backend (NestJS)
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ghost-api-prod
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ghost}:${POSTGRES_PASSWORD:-ghost}@db:5432/${POSTGRES_DB:-ghost}
      - JWT_SECRET=${JWT_SECRET}
      - API_PORT=4003
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - OLLAMA_HOST=http://ollama:11434
      - GHOST_SERVER_URL=http://gateway:4729
      - GHOST_LOG_WS_URL=ws://gateway:4729/ws/semantic
      - GHOST_SERVER_API_KEY=${GHOST_API_KEY:-ghost-prod-api}
    ports:
      - "127.0.0.1:4003:4003"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      gateway:
        condition: service_healthy
    networks:
      - ghost-internal
      - ghost-public
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=100m

  # Dashboard (Next.js)
  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    container_name: ghost-dashboard-prod
    environment:
      - NEXT_PUBLIC_API_URL=https://api.${DOMAIN:-localhost}
      - NEXT_PUBLIC_GHOST_LOG_WS_URL=wss://gateway.${DOMAIN:-localhost}/ws/semantic
    ports:
      - "127.0.0.1:4004:4004"
    depends_on:
      - api
    networks:
      - ghost-public
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4004"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=50m

  # Ghost Server (Sandbox)
  ghost-server:
    build:
      context: ./services/ghost-server
      dockerfile: Dockerfile
    container_name: ghost-server-prod
    environment:
      - GHOST_PORT=3891
      - GHOST_API_KEY=${GHOST_API_KEY:-ghost-prod-api}
      - GHOST_SANDBOX_TIMEOUT=30
      - GHOST_MEMORY_LIMIT=256MB
    ports:
      - "127.0.0.1:3891:3891"
    networks:
      - ghost-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3891/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=50m
      - /sandbox:rw,noexec,nosuid,size=100m

volumes:
  pgdata:
    driver: local
  ollama_models:
    driver: local
  mirror_npm_data:
    driver: local
  mirror_pypi_data:
    driver: local
  gateway_storage:
    driver: local

networks:
  ghost-internal:
    driver: bridge
    internal: true
  ghost-public:
    driver: bridge
