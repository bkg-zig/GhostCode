[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
authors = ["Ghost Coding Cave Contributors"]

[workspace.dependencies]
anyhow = "1.0"
blake3 = "1.5"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
helper-core = { path = "crates/helper-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.10"
tokio = { version = "1.37", features = ["macros", "rt", "fs"] }
uuid = { version = "1.8", features = ["v4", "serde"] }

[workspace.metadata]
description = "Ghost Coding Cave rust-core workspace"
