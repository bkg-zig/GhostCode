name: Deploy to Production

on:
  push:
    branches: [ main ]
    paths:
      - '**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Cargo index
        uses: actions/cache@v3
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-index-

      - name: Run cargo audit
        run: |
          cd rust-core
          cargo install cargo-audit
          cargo audit --deny warnings
        continue-on-error: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: |
          cd .
          pnpm install --frozen-lockfile

      - name: Run pnpm audit
        run: |
          cd .
          pnpm audit --audit-level high
        continue-on-error: false

  rust-build:
    name: Build Rust Components
    runs-on: ubuntu-latest
    needs: security-audit
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run cargo fmt
        run: |
          cd rust-core
          cargo fmt --all -- --check

      - name: Run cargo clippy
        run: |
          cd rust-core
          cargo clippy -- -D warnings

      - name: Run cargo test
        run: |
          cd rust-core
          cargo test --workspace

      - name: Build release binaries
        run: |
          cd rust-core
          cargo build --release --workspace

      - name: Upload gateway binary
        uses: actions/upload-artifact@v3
        with:
          name: gateway-binary
          path: rust-core/target/release/gateway
          retention-days: 1

  node-build:
    name: Build Node Components
    runs-on: ubuntu-latest
    needs: security-audit
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: |
          cd .
          pnpm install --frozen-lockfile

      - name: Run ESLint
        run: |
          cd .
          pnpm run lint

      - name: Run TypeScript check
        run: |
          cd .
          pnpm exec tsc --noEmit

      - name: Build applications
        run: |
          cd .
          pnpm run build

      - name: Upload API build
        uses: actions/upload-artifact@v3
        with:
          name: api-build
          path: apps/api/dist/
          retention-days: 1

      - name: Upload dashboard build
        uses: actions/upload-artifact@v3
        with:
          name: dashboard-build
          path: apps/dashboard/.next/
          retention-days: 1

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [rust-build, node-build]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: gateway
            context: ./rust-core
            dockerfile: Dockerfile
            artifact: gateway-binary
          - service: api
            context: .
            dockerfile: apps/api/Dockerfile
            artifact: api-build
          - service: dashboard
            context: .
            dockerfile: apps/dashboard/Dockerfile
            artifact: dashboard-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: ${{ matrix.artifact }}
          path: ./artifacts/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context == '.' && matrix.dockerfile || format('{0}/{1}', matrix.context, matrix.dockerfile) }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging environment
        run: |
          echo "Deploying to staging environment..."
          # Add your staging deployment commands here
          # Example: kubectl apply -f k8s/staging/ or docker-compose up -d on staging server
          echo "Staging deployment completed"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for manual approval
        run: |
          echo "Waiting for production deployment approval..."
          # In a real scenario, this would wait for manual approval

      - name: Deploy to production
        run: |
          echo "Deploying to production environment..."
          # Add your production deployment commands here
          # Example: kubectl apply -f k8s/production/ or docker-compose up -d on production server
          echo "Production deployment completed"

      - name: Run smoke tests
        run: |
          echo "Running post-deployment smoke tests..."
          # Add smoke test commands here
          # Example: curl -f https://api.your-domain.com/health
          echo "Smoke tests passed"

      - name: Send deployment notification
        run: |
          echo "Sending deployment notification..."
          # Add notification commands here (Slack, email, etc.)
          echo "Deployment notification sent"
